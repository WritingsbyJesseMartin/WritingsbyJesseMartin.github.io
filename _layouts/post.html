---
layout: default
---
<article class="single-post">
  <h1>{{ page.title }}</h1>
  <p class="date">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/' | relative_url }}">&larr; Back to all writings</a></p>
</article>
